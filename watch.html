<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Google Drive Instant Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #070b14;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .container {
      width: 100%;
      max-width: 760px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 10px;
      word-break: break-word;
      text-align: center;
    }
    .video-wrap {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
    }
    video {
      width: 100%;
      max-height: 72vh;
      display: block;
      background: #000;
    }
    .speeds {
      display: none;
      gap: 6px;
      justify-content: center;
      margin-bottom: 12px;
    }
    .sp-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .sp-btn.active {
      background: #38bdf8;
      color: #082f49;
      border-color: #38bdf8;
    }
    .status-box {
      text-align: center;
      padding: 18px 10px;
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-del { background: #ef4444; color: #fff; }
    .btn-ext { background: #22c55e; color: #052e16; }
    .btn-close { background: #334155; color: #f8fafc; }
  </style>
</head>
<body>
  <div class="container">
    <div class="title" id="vid-title">Memuat Google Drive...</div>
    <div class="status-box" id="status-box">⚡ Menyiapkan jalur streaming instan (0 detik tunggu)...</div>

    <div class="video-wrap" id="video-wrap">
      <video id="player" controls autoplay playsinline preload="metadata"></video>
    </div>

    <div class="speeds" id="speed-bar">
      <button class="sp-btn active" data-sp="1">1x</button>
      <button class="sp-btn" data-sp="1.25">1.25x</button>
      <button class="sp-btn" data-sp="1.5">1.5x</button>
      <button class="sp-btn" data-sp="2">2x</button>
    </div>

    <div class="btn-row" id="actions"></div>
  </div>

  <script>
    (function() {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      const fullCurrentUrl = window.location.href;
      const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const fileId = params.get('id') || '';
      const act = params.get('act') || 'watch';
      const name = params.get('name') || 'Video Google Drive';
      const cid = params.get('cid') || localStorage.getItem('gd_cid') || '';
      const sec = params.get('sec') || localStorage.getItem('gd_sec') || '';
      const rt = params.get('rt') || localStorage.getItem('gd_rt') || '';

      if (cid && sec && rt) {
        localStorage.setItem('gd_cid', cid);
        localStorage.setItem('gd_sec', sec);
        localStorage.setItem('gd_rt', rt);
      }

      const titleEl = document.getElementById('vid-title');
      const statusBox = document.getElementById('status-box');
      const videoWrap = document.getElementById('video-wrap');
      const player = document.getElementById('player');
      const speedBar = document.getElementById('speed-bar');
      const actions = document.getElementById('actions');

      titleEl.textContent = '🎬 ' + name;

      function closeWin() {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
          window.Telegram.WebApp.close();
        } else {
          window.close();
        }
      }

      document.querySelectorAll('.sp-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.sp-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          player.playbackRate = parseFloat(btn.dataset.sp);
        };
      });

      async function getAccessToken() {
        const body = new URLSearchParams({
          client_id: cid,
          client_secret: sec,
          refresh_token: rt,
          grant_type: 'refresh_token'
        });
        for (let i = 0; i < 8; i++) {
          const res = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body
          });
          if (res.ok) {
            const data = await res.json();
            return data.access_token;
          }
          await new Promise(r => setTimeout(r, 1500));
        }
        throw new Error('Gagal otentikasi ke Google Drive.');
      }

      async function ensureServiceWorker() {
        if (!('serviceWorker' in navigator)) return false;
        try {
          await navigator.serviceWorker.register('./sw.js', { scope: './' });
          await navigator.serviceWorker.ready;
          if (!navigator.serviceWorker.controller) {
            await new Promise((resolve) => {
              const timer = setTimeout(resolve, 2500);
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                clearTimeout(timer);
                resolve();
              }, { once: true });
            });
          }
          return Boolean(navigator.serviceWorker.controller);
        } catch (e) {
          return false;
        }
      }

      async function deleteFile() {
        player.pause();
        player.removeAttribute('src');
        videoWrap.style.display = 'none';
        speedBar.style.display = 'none';
        statusBox.style.display = 'block';
        statusBox.textContent = '🗑️ Menghapus video secara permanen dari Google Drive...';
        actions.innerHTML = '';

        const token = await getAccessToken();
        let lastStatus = 0;
        for (let i = 0; i < 12; i++) {
          const res = await fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(fileId), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          lastStatus = res.status;
          if (res.status === 204 || res.status === 200 || res.status === 404) {
            statusBox.innerHTML = '✅ <b>Video berhasil dihapus permanen dari Google Drive!</b><br><span style="font-size:12px;color:#94a3b8;">Penyimpanan Google Drive kamu sudah bersih kembali.</span>';
            actions.innerHTML = '<button class="btn btn-close" id="btn-back">Kembali ke Chat Telegram</button>';
            document.getElementById('btn-back').onclick = closeWin;
            return;
          }
          if (res.status !== 403 && res.status !== 429 && res.status < 500) break;
          await new Promise(r => setTimeout(r, 2000));
        }

        statusBox.textContent = '❌ Gagal menghapus file (HTTP ' + lastStatus + '). Coba tekan ulang sebentar lagi.';
        actions.innerHTML = '<button class="btn btn-close" id="btn-back">Kembali ke Chat Telegram</button>';
        document.getElementById('btn-back').onclick = closeWin;
      }

      async function setupFallbackDirectStream() {
        const token = await getAccessToken();
        const directApiUrl = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(fileId) + '?alt=media&acknowledgeAbuse=true&access_token=' + encodeURIComponent(token);
        let retries = 0;
        player.onerror = async () => {
          if (retries >= 10) return;
          retries++;
          const savedTime = player.currentTime || 0;
          await new Promise(r => setTimeout(r, 1500));
          const freshTok = await getAccessToken();
          player.src = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(fileId) + '?alt=media&acknowledgeAbuse=true&access_token=' + encodeURIComponent(freshTok);
          player.currentTime = savedTime;
          player.play().catch(() => {});
        };
        player.src = directApiUrl;
      }

      async function run() {
        if (!fileId || !cid || !sec || !rt) {
          statusBox.textContent = '⚠️ Data tautan tidak lengkap. Silakan klik tombol langsung dari chat bot.';
          return;
        }
        try {
          if (act === 'delete') {
            await deleteFile();
            return;
          }

          const hasSW = await ensureServiceWorker();
          statusBox.style.display = 'none';
          videoWrap.style.display = 'block';
          speedBar.style.display = 'flex';

          if (hasSW) {
            const q = new URLSearchParams({ cid, sec, rt });
            player.src = './__stream/' + encodeURIComponent(fileId) + '?' + q.toString();
            // Fallback otomatis jika Service Worker terputus di WebView tertentu
            player.onerror = () => {
              player.onerror = null;
              setupFallbackDirectStream();
            };
          } else {
            await setupFallbackDirectStream();
          }

          // Intent Chrome Android agar jika dibuka eksternal tetap masuk ke Instant Player ini (bukan halaman download GDrive!)
          const noProto = fullCurrentUrl.replace(/^https?:\/\//, '');
          const chromeIntent = 'intent://' + noProto + '#Intent;scheme=https;package=com.android.chrome;end';

          actions.innerHTML =
            '<a class="btn btn-ext" id="btn-chrome" href="' + chromeIntent + '">🌐 Buka Layar Penuh di Chrome</a>' +
            '<button class="btn btn-del" id="btn-del-now">🗑️ Selesai Nonton? Hapus dari Drive</button>' +
            '<button class="btn btn-close" id="btn-close-now">Tutup</button>';

          document.getElementById('btn-del-now').onclick = async () => {
            if (confirm('Hapus video ini secara permanen dari Google Drive sekarang?')) {
              await deleteFile();
            }
          };
          document.getElementById('btn-close-now').onclick = closeWin;
        } catch (err) {
          statusBox.textContent = '❌ Error: ' + err.message;
        }
      }

      run();
    })();
  </script>
</body>
</html>
